# Fluent Bit DaemonSet — ships every pod's stdout (the app's structured JSON,
# docs/infrastructure-logging.md) to the in-cluster OpenObserve
# (openobserve.yaml). This is the "collector DaemonSet" half of the log
# retention backlog item.
#
# Design notes:
# - Output uses the generic `http` plugin POSTing json_lines to OpenObserve's
#   ingestion endpoint /api/{org}/{stream}/_json with gzip, per Fluent Bit's
#   documented OpenObserve recipe (docs.fluentbit.io → Outputs → OpenObserve).
#   The org/stream are `default`/`default` — the SAME stream the Northflank
#   era wrote to, so history and live logs form one timeline.
# - Credentials come from the same `openobserve-auth` Secret as the
#   OpenObserve Deployment (env-substituted via ${OPENOBSERVE_USER} /
#   ${OPENOBSERVE_PASSWORD} — never committed). Create a dedicated
#   least-privilege ingestion user in the OpenObserve UI later and swap the
#   secret; the root user works but is broader than needed.
# - The collector excludes its own log files to avoid feedback loops.
# - Retry_Limit False: if OpenObserve is briefly down, chunks retry
#   indefinitely; with the trimmed (memory-only) buffering the input
#   pauses at Mem_Buf_Limit until the sink returns — recent container
#   logs remain on the node's disk either way (containerd keeps them
#   under /var/log/pods).
# - The kubernetes filter enriches each line with namespace/pod/container
#   names read from the kube API (read-only, least-privilege ClusterRole
#   below) — this is what makes the logs searchable by workload.
# - The tail DB (byte positions) lives on a hostPath so a collector restart
#   resumes where it left off instead of re-shipping (and duplicating) logs.
#
# ⚠ APPLIED 2026-11-08 (trimmed profile) → **ROLLED BACK the same
# morning**: the go/no-go passed (every node ≥ ~400 Mi free) but f985n
# had quietly gained ~250 Mi overnight — BOTH RWX volume engines (media +
# SNOMED) + their share-managers drifted onto it — and was already
# liveness-killing its web pod BEFORE the collector existed (08:38,
# pre-apply); with the collector (+86 Mi → 89%) it killed the pod again
# → the documented rollback fired. The collector itself WORKED:
# 526,717 records / ~324 MB shipped to OpenObserve in ~20 min; the ~2-day
# container-log backlog was still draining (oldest-first) when the DS was
# deleted — hence the stream ends at 11-05 21:35 with nothing "live" yet.
# RE-APPLIED 09:06 UTC 2026-11-08 after the engine move — LIVE and
# shipping (steady state: large 53% / f985n 82% / hwp2f 78%). The FULL
# footprint (50MB buffer + filesystem buffering) tipped a ~2 GiB node
# into stalls on 2026-11-05 — do NOT restore it without re-running the
# headroom gate. Still deliberately absent from kustomization.yaml
# (self-hoster safety).
#
# PARSER FIX 2026-11-08 (later): first Civo-era records landed with the
# whole CRI line flat in `log` (no merged app fields) — the `containerd`
# parser was the docker-JSON parser, which cannot read CRI text lines.
# Replaced with a proper CRI regex parser (`cri`); Merge_Log now unwraps
# the app JSON into top-level fields (message/level/logger/...). Records
# ingested before the fix keep the old shape and age out via retention.
# History: NOT APPLIED 2026-11-05 (storm) → resize 2026-11-07 → applied
# trimmed 2026-11-08 08:41 → rolled back 09:02 (f985n engine drift,
# second web-pod liveness kill) → engines moved to the large node 09:00 →
# re-applied 09:06 — LIVE.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-collector
  namespace: checktick
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: checktick-log-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: checktick-log-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: checktick-log-collector
subjects:
  - kind: ServiceAccount
    name: log-collector
    namespace: checktick
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: log-collector-config
  namespace: checktick
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf
        storage.path  /flb-state/buffers

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        # Trimmed profile (2026-11-08): self-exclusion (no feedback loop)
        # PLUS the CNPG pods' chatty triple-logs (postgres emits every line
        # 3x) — excluded for footprint; the compliance record is AuditLog in
        # PostgreSQL anyway, and db logs stay on the node via containerd.
        # STAGING exclusion (2026-11-08, CTO): every *staging* container log —
        # web, cron AND the staging CNPG pod (the *checktick-db* glob does
        # NOT match checktick-staging-db-1) — is dropped so the prod
        # default/default stream stays unmixed. Deliberate alternative to a
        # second staging stream (needs a second tail input + output on every
        # node); staging logs stay viewable via `kubectl logs` / containerd
        # files on the node.
        Exclude_Path      /var/log/containers/*log-collector*.log,/var/log/containers/*checktick-db*.log,/var/log/containers/*staging*.log
        Parser            cri
        Tag               kube.*
        DB                /flb-state/tail.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On

    [FILTER]
        Name              kubernetes
        Match             kube.*
        Kube_URL          https://kubernetes.default.svc:443
        Kube_CA_File      /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File   /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix   kube.var.log.containers.
        Merge_Log         On
        K8S-Logging.Parser   Off
        K8S-Logging.Exclude  Off

    [OUTPUT]
        Name            http
        Match           kube.*
        Host            openobserve.checktick.svc.cluster.local
        Port            5080
        URI             /api/default/default/_json
        # OpenObserve's _json endpoint parses the body as ONE JSON document:
        # the documented Fluent Bit recipe uses Format json (a JSON array of
        # records per flush). json_lines (NDJSON) gets a 400 "trailing
        # characters" from OpenObserve v1.x.
        Format          json
        JSON_Date_Key   timestamp
        JSON_Date_Format iso8601
        HTTP_User       ${OPENOBSERVE_USER}
        HTTP_Passwd     ${OPENOBSERVE_PASSWORD}
        Compress        gzip
        Retry_Limit     False
        Tls             Off
  # CRI (containerd) log-line parser. /var/log/containers/*.log lines are
  # "<rfc3339-nanos> <stdout|stderr> <F|P> <payload>" — NOT the docker JSON
  # wrapper {"log":...} the previous parser assumed. That mismatch is why
  # records landed with the whole CRI line flat in `log` and Merge_Log could
  # not unwrap the app JSON (root-caused 2026-11-08, see history above).
  # Defined here rather than relying on Fluent Bit's built-in `cri` parser
  # because the config mount replaces /fluent-bit/etc wholesale, taking the
  # image's stock parsers.conf with it. [PARSER] sections belong in the
  # Parsers_File, not the main config.
  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[FP]) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-collector
  namespace: checktick
  labels:
    app: log-collector
spec:
  selector:
    matchLabels:
      app: log-collector
  template:
    metadata:
      labels:
        app: log-collector
    spec:
      serviceAccountName: log-collector
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.5
          env:
            # Substituted into fluent-bit.conf — never committed.
            - name: OPENOBSERVE_USER
              valueFrom:
                secretKeyRef:
                  name: openobserve-auth
                  key: OPENOBSERVE_USER
            - name: OPENOBSERVE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openobserve-auth
                  key: OPENOBSERVE_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
            - name: varlog
              mountPath: /var/log
              readOnly: true
            # Tail DB + filesystem buffers survive collector restarts.
            - name: flb-state
              mountPath: /flb-state
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: log-collector-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: flb-state
          hostPath:
            path: /var/lib/checktick-log-collector
            type: DirectoryOrCreate
