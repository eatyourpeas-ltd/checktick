---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: process-recovery-time-delays
  namespace: checktick
spec:
  schedule: "*/15 * * * *"  # 2026-11-07: was */5 — the enforced control is a
  # 24–48 h ethical delay (RecoveryRequest.time_delay_hours); the cadence only
  # bounds admin-email latency (≤15 min) + stuck-job detection. Keep the
  # healthchecks.io dashboard check in sync (schedule + grace).
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            checktick.io/db-client: "true"
        spec:
          restartPolicy: Never
          containers:
            - name: run
              image: ghcr.io/eatyourpeas-ltd/checktick:0.27.1
              command:
                - sh
                - -c
                - >-
                  python manage.py process_recovery_time_delays && if [ -n "$HC_PING_PROCESS_RECOVERY_TIME_DELAYS" ]; then curl -fsS --retry 3 "$HC_PING_PROCESS_RECOVERY_TIME_DELAYS" > /dev/null; fi
              envFrom:
                - configMapRef: {name: checktick-config}
                - configMapRef: {name: checktick-config-local}
                - secretRef: {name: checktick-secrets}
              resources:
                requests: {memory: 128Mi, cpu: 100m}
                limits: {memory: 512Mi}
---
# SNOMED CT importer — the in-cluster half of the CI build pipeline
# (.github/workflows/build-snomed-db.yml builds snomed.db on a free GitHub
# runner and uploads it to s3://checktick-backups/snomed/snomed.db).
#
# initContainer: download to a temp name on the PVC, then rename into place
# (same atomic-swap contract the old updater's os.replace() gave — web pods'
# snomed-copy initContainer reads the file at pod start, and readers keep
# their already-open fd). Runs as root: the Longhorn RWX (NFS) share is
# root-owned and does not honour fsGroup; the chmod 644 result stays
# world-readable for the web pods' initContainer copy. Pin the aws-cli
# image tag for production (same post-POC hygiene as the app image).
# Main container: refresh the DataSet descriptors in Postgres — the CI
# builder runs update_snomed_db --no-seed because it has no app database.
#
# Reuses the CNPG backup credential Secret (checktick-db-backup-creds:
# ACCESS_KEY_ID / SECRET_ACCESS_KEY / REGION=lon1) and the same Civo
# object-store checksum env vars as the backup cluster. Clusters WITHOUT
# the object-store pipeline can instead run `update_snomed_db` directly
# (needs 8 GiB memory and TRUD_API_KEY — see the workflow header).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: import-snomed-db
  namespace: checktick
spec:
  schedule: "0 14 * * 2" # weekly, Tuesday 14:00 UTC — after the Monday CI build
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            checktick.io/db-client: "true"
        spec:
          restartPolicy: Never
          initContainers:
            - name: download
              image: amazon/aws-cli:latest
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: {name: checktick-db-backup-creds, key: ACCESS_KEY_ID}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: {name: checktick-db-backup-creds, key: SECRET_ACCESS_KEY}
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    secretKeyRef: {name: checktick-db-backup-creds, key: REGION}
                # Civo object store rejects the default payload-checksum
                # mode of modern S3 clients (POC finding — see the CNPG
                # cluster env for the full story)
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: when_required
                - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                  value: when_required
              command:
                - sh
                - -c
                - |
                  set -eu
                  aws s3 cp s3://checktick-backups/snomed/snomed.db /app/data/snomed.db.new \
                    --endpoint-url https://objectstore.lon1.civo.com
                  chmod 644 /app/data/snomed.db.new
                  mv /app/data/snomed.db.new /app/data/snomed.db
                  ls -lh /app/data/snomed.db
              volumeMounts:
                - name: snomed-data
                  mountPath: /app/data
          containers:
            - name: seed
              image: ghcr.io/eatyourpeas-ltd/checktick:0.27.1
              command:
                - sh
                - -c
                - >-
                  python manage.py seed_snomed_datasets --force && if [ -n "$HC_PING_IMPORT_SNOMED_DB" ]; then curl -fsS --retry 3 "$HC_PING_IMPORT_SNOMED_DB" > /dev/null; fi
              envFrom:
                - configMapRef: {name: checktick-config}
                - configMapRef: {name: checktick-config-local}
                - secretRef: {name: checktick-secrets}
              resources:
                requests: {memory: 256Mi, cpu: 250m}
                limits: {memory: 1Gi}
              volumeMounts:
                - name: snomed-data
                  mountPath: /app/data
          volumes:
            - name: snomed-data
              persistentVolumeClaim:
                claimName: checktick-snomed-data
