# Scheduled tasks as CronJobs — the Kubernetes equivalent of the Northflank
# cron services. Command semantics and required frequencies are documented in
# docs/self-hosting-scheduled-tasks.md (authoritative list).
#
# The billing commands (process_*_subscriptions, process_promotion_lifecycle)
# are no-ops when SELF_HOSTED=True; the hosted service runs in SaaS mode, so
# they stay enabled here.
#
# Schedules are UTC. Daily jobs are staggered so they do not stampede the
# database. The SNOMED updater runs on UK weekday afternoons to avoid the TRUD
# maintenance windows (weekdays 18:00–08:00 UK) and allocates 8 GiB: the
# sct ndjson step peaks above 4 GiB and will be OOM-killed with less.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: process-data-governance
  namespace: checktick
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 172800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: run
              image: ghcr.io/eatyourpeas-ltd/checktick:latest
              command: ["python", "manage.py", "process_data_governance"]
              envFrom:
                - configMapRef: {name: checktick-config}
                - secretRef: {name: checktick-secrets}
              resources:
                requests: {memory: 256Mi, cpu: 250m}
                limits: {memory: 1Gi}
