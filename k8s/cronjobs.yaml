---
# SNOMED CT updater. Writes to the shared RWX PVC with an atomic
# os.replace() swap (safe while web pods serve). Web pods pick up the new
# file on their next restart. Exits cleanly when TRUD_API_KEY is unset.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: update-snomed-db
  namespace: checktick
spec:
  schedule: "0 13 * * 1-5" # UK weekday afternoons, outside TRUD maintenance windows
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0 # a failed 1.8 GB download should not auto-retry blindly
      activeDeadlineSeconds: 14400
      ttlSecondsAfterFinished: 172800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: run
              image: ghcr.io/eatyourpeas-ltd/checktick:latest
              command: ["python", "manage.py", "update_snomed_db"]
              envFrom:
                - configMapRef: {name: checktick-config}
                - secretRef: {name: checktick-secrets}
              resources:
                # sct ndjson peaks above 4 GiB; 4 GiB gets OOM-killed (exit -9)
                requests: {memory: 8Gi, cpu: "1"}
                limits: {memory: 8Gi, cpu: "2"}
              volumeMounts:
                - name: snomed-data
                  mountPath: /app/data
          volumes:
            - name: snomed-data
              persistentVolumeClaim:
                claimName: checktick-snomed-data
