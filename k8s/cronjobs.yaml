# Scheduled tasks as CronJobs — the Kubernetes equivalent of platform-level
# cron services. Command semantics and required frequencies are documented in
# docs/self-hosting-scheduled-tasks.md (authoritative list).
#
# The billing commands (process_*_subscriptions, process_promotion_lifecycle)
# are no-ops when SELF_HOSTED=True; the hosted service runs in SaaS mode, so
# they stay enabled here.
#
# Schedules are UTC. Daily jobs are staggered so they do not stampede the
# database. SNOMED is NOT built in-cluster: the sct ndjson step peaks above
# 4 GiB, so the old 8 GiB update-snomed-db CronJob can never run on the Civo
# POC nodes (2 vCPU/4 GB). Instead, .github/workflows/build-snomed-db.yml
# builds snomed.db on a free GitHub runner and uploads it to the object
# store; the import-snomed-db CronJob below is the small in-cluster half
# (download + atomic rename + seed).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: process-data-governance
  namespace: checktick
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            checktick.io/db-client: "true"
        spec:
          restartPolicy: Never
          containers:
            - name: run
              image: ghcr.io/eatyourpeas-ltd/checktick:0.27.1
              command:
                - sh
                - -c
                - >-
                  python manage.py process_data_governance && if [ -n "$HC_PING_PROCESS_DATA_GOVERNANCE" ]; then curl -fsS --retry 3 "$HC_PING_PROCESS_DATA_GOVERNANCE" > /dev/null; fi
              envFrom:
                - configMapRef: {name: checktick-config}
                - configMapRef: {name: checktick-config-local}
                - secretRef: {name: checktick-secrets}
              resources:
                requests: {memory: 256Mi, cpu: 250m}
                limits: {memory: 1Gi}
