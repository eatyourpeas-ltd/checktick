# One-shot apply:  kubectl apply -k k8s/
# The checktick-secrets Secret is intentionally NOT managed by kustomize —
# create it from the local git-ignored env file (see k8s/README.md).
# k8s/postgres-cnpg.yaml (optional in-cluster DB) is also excluded: it
# requires the CloudNativePG operator to be installed first. Apply it
# separately if you choose that path — see k8s/README.md "Database options".
# k8s/ingress.yaml is a TEMPLATE (hostname is environment-identifying):
# copy to the git-ignored k8s/ingress.local.yaml and apply out-of-band.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - web-configmap.yaml
  - vault.yaml
  - web.yaml
  - migrate-job.yaml
  - cronjobs.yaml
  - postgres-networkpolicy.yaml
  - openobserve.yaml
  # NOTE: k8s/log-collector.yaml is NOT listed here on purpose. Deploying a
  # collector DaemonSet (one fluent-bit per node) tipped the smallest node
  # over its memory wall on 2026-11-05 (found live) and restart-looped
  # everything on it, including the CNPG primary. Re-apply it
  # out-of-band ONLY after the node pool is resized or the collector is
  # reworked (nodeSelector / smaller footprint): the file is committed and
  # ready, but `kubectl apply -k k8s/` must not silently recreate it.
  # NOTE: k8s/vault-snapshot.yaml (nightly ENCRYPTED Vault snapshot CronJob)
  # is NOT listed here on purpose either: it requires the Raft migration
  # window is complete + the vault-snapshot AppRole ceremony + the operator
  # age keypair, all environment-specific/out-of-band (see the file header).
  # Apply it out-of-band after the Vault is on Raft storage; before then it
  # would fail nightly at AppRole login.
  # The openobserve-auth Secret is intentionally NOT managed by kustomize —
  # create it from the local git-ignored env file (see k8s/openobserve.example.env),
  # same pattern as checktick-secrets above.
