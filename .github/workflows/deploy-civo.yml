# Deploys a published CheckTick image from GHCR to the Civo cluster.
#
# This is the production + staging deployment workflow. The image itself is built
# and published by docker-publish.yml; this workflow deploys a tag that
# already exists in GHCR.
#
# One-time setup:
#   civo k8s config <cluster-name> > /tmp/kubeconfig.yaml   # or download from the Civo dashboard
#   base64 < /tmp/kubeconfig.yaml | gh secret set CIVO_KUBECONFIG
#   rm /tmp/kubeconfig.yaml
#
#   The kubeconfig is cluster-admin for now; a least-privilege
#   ServiceAccount kubeconfig is on the hardening backlog
#   (docs/civo-kubernetes-operations.md).
#
# Deploy sequence (zero downtime):
#   1. pre-deploy Job (migrate + idempotent syncs) pinned to the SAME tag
#   2. rolling update of the web Deployment (maxUnavailable: 0)
#   3. rollout must pass readiness (/healthz gates traffic)
#   4. smoke check against the service
#   5. roll every prod CronJob in the namespace to the deployed tag
#      (CronJobs are NOT part of the Deployment rollout — without this
#      they keep the tag pinned in k8s/cronjobs.yaml and drift; they sat
#      on 0.24.2 while the web Deployment ran 0.25.x)
#   6. automatic rollback if anything fails after the image changed
#   7. deploy-staging job (needs: deploy): the SAME sequence against the
#      staging environment — staging migrate Job, staging web rollout,
#      staging smoke check, then the one staging CronJob. A staging
#      failure never rolls back prod (separate job); with
#      maxUnavailable: 0 a failed staging rollout leaves the previous
#      tag serving.
#
# Migration discipline: if step 1 succeeds but the rollout is rolled back,
# the PREVIOUS image briefly runs against the NEW schema. Migrations must
# therefore stay expansion/contract (additive for one release) — see the
# runbook and k8s/README.md.
#
# NOTE: on main publishes, docker-publish.yml dispatches this workflow with
# the newly published image tag (swapped from the previous platform's
# deployment webhook at migration close-out — runbook Phase 6).
# Add protection rules (required reviewers) to the `civo` GitHub
# environment to make dispatch a gated production deploy.

name: Deploy (Civo)

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "GHCR image tag to deploy (a published release tag)"
        required: true
        type: string
      namespace:
        description: "Namespace to deploy into"
        default: "checktick"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Never two deploys racing in the same namespace
  group: deploy-civo-${{ inputs.namespace }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/eatyourpeas-ltd/checktick
  # Job-level on purpose: kubectl in EVERY step must resolve this. A
  # step-level env only reaches "Configure kubectl" and later steps fall
  # back to localhost:8080 (exactly what happened on the first dispatch).
  KUBECONFIG: /tmp/checktick-kubeconfig

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: civo
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure kubectl
        run: |
          printf '%s' "${{ secrets.CIVO_KUBECONFIG }}" | base64 -d > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl version --client=false  # fail fast if the kubeconfig is bad

      - name: Pre-flight check
        env:
          NS: ${{ inputs.namespace }}
        run: |
          kubectl -n "$NS" get deploy checktick-web
          kubectl -n "$NS" get secret checktick-secrets

      - name: Pre-deploy job (migrations + syncs)
        env:
          NS: ${{ inputs.namespace }}
          TAG: ${{ inputs.image-tag }}
        run: |
          # Job specs are immutable — clear any previous run first
          kubectl -n "$NS" delete job checktick-predeploy --ignore-not-found
          # Pin the migrate job to the exact tag being deployed so the
          # migration always runs with the code it belongs to. The manifest
          # carries a pinned released tag (never `latest`) — substitute
          # whatever tag is pinned with the dispatched one.
          sed "s|checktick:[^ ]*|checktick:${TAG}|" k8s/migrate-job.yaml \
            | kubectl apply -f -
          kubectl -n "$NS" wait --for=condition=complete \
            job/checktick-predeploy --timeout=300s

      - name: Roll out new image
        id: set_image
        env:
          NS: ${{ inputs.namespace }}
          TAG: ${{ inputs.image-tag }}
        run: |
          kubectl -n "$NS" set image deployment/checktick-web \
            web="${IMAGE}:${TAG}"

      - name: Wait for rollout (readiness-gated, zero downtime)
        env:
          NS: ${{ inputs.namespace }}
        run: |
          kubectl -n "$NS" rollout status deployment/checktick-web \
            --timeout=300s

      - name: Smoke check (/healthz via the service)
        env:
          NS: ${{ inputs.namespace }}
          TAG: ${{ inputs.image-tag }}
        run: |
          # Uses the app image itself (curl is installed in it) so no
          # third-party image is needed; tests service DNS + a ready pod
          kubectl -n "$NS" run "deploy-smoke-${GITHUB_RUN_ID}" \
            --restart=Never -i --rm \
            --image="${IMAGE}:${TAG}" \
            --command -- curl -fsS --max-time 10 \
            "http://checktick-web.${NS}.svc.cluster.local:8000/healthz"
          echo "OK: /healthz healthy after deploy"

      - name: Roll CronJobs to new image
        env:
          NS: ${{ inputs.namespace }}
          TAG: ${{ inputs.image-tag }}
        run: |
          # CronJobs are NOT part of the Deployment rollout above. Without
          # this step they keep running the tag pinned in k8s/cronjobs.yaml
          # until the next manual apply — they sat on 0.24.2 while the web
          # Deployment was rolled to 0.25.x (found 2026-11-07). Runs AFTER the
          # smoke check so CronJobs only move once the tag is verified live.
          # Set every container of every CronJob in the namespace (handles
          # the `run`/`seed` naming mix); each next scheduled pod runs the tag.
          # EXCEPT out-of-band CronJobs: vault-snapshot (k8s/vault-snapshot.yaml,
          # applied separately) carries purpose-built images (hashicorp/vault,
          # alpine, amazon/aws-cli), NOT the app image. Rolling it to the app
          # tag broke the nightly snapshot upload — "aws: not found", the
          # 03:45 UTC run failed 2026-11-08 (found from the Error pods; the
          # missed HC_PING alerted via healthchecks.io). Never roll it here.
          for cj in $(kubectl -n "$NS" get cronjobs -o name); do
            case "$cj" in
              cronjob/vault-snapshot)
                echo "Skipping $cj (out-of-band, non-app images)"
                continue
                ;;
              cronjob/prune-unconfirmed-users-staging)
                echo "Skipping $cj (rolled by the deploy-staging job, after the staging DB is migrated)"
                continue
                ;;
            esac
            args=""
            for c in $(kubectl -n "$NS" get "$cj" \
              -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[*].name}'); do
              args="$args $c=${IMAGE}:${TAG}"
            done
            echo "Setting $cj -> ${IMAGE}:${TAG}"
            # shellcheck disable=SC2086 — args is deliberately word-split
            kubectl -n "$NS" set image "$cj" $args
          done
          echo "CronJob images now:"
          kubectl -n "$NS" get cronjobs \
            -o custom-columns='NAME:.metadata.name,IMAGES:.spec.jobTemplate.spec.template.spec.containers[*].image'

      - name: Diagnose failure
        if: failure()
        env:
          NS: ${{ inputs.namespace }}
        run: |
          kubectl -n "$NS" describe job checktick-predeploy || true
          kubectl -n "$NS" logs job/checktick-predeploy --tail=100 || true
          kubectl -n "$NS" get pods -l app=checktick-web -o wide || true

      - name: Rollback on failure
        if: failure() && steps.set_image.outcome == 'success'
        env:
          NS: ${{ inputs.namespace }}
        run: |
          echo "! deploy failed after the image changed — rolling back"
          kubectl -n "$NS" rollout undo deployment/checktick-web
          kubectl -n "$NS" rollout status deployment/checktick-web \
            --timeout=180s

      - name: Report deployed image
        if: success()
        env:
          NS: ${{ inputs.namespace }}
        run: |
          kubectl -n "$NS" get deploy checktick-web \
            -o jsonpath='{.spec.template.spec.containers[0].image} is live'

  # Staging deploy — runs AFTER the prod job succeeds (needs: deploy), so
  # one dispatch deploys both environments in the correct order.
  #
  # Separate job on purpose: a staging failure must NEVER trigger the prod
  # rollback step (which lives in the deploy job). Staging is disposable,
  # and with maxUnavailable: 0 a failed staging rollout simply leaves the
  # previous tag serving while the surge pod never goes ready.
  #
  # No `environment:` gate: the `civo` environment approval on the deploy
  # job already gates this dispatch (one approval per release, not two),
  # and CIVO_KUBECONFIG is a repo-level secret.
  deploy-staging:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure kubectl
        run: |
          printf '%s' "${{ secrets.CIVO_KUBECONFIG }}" | base64 -d > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl version --client=false  # fail fast if the kubeconfig is bad

      - name: Pre-flight check (staging)
        env:
          NS: ${{ inputs.namespace }}
        run: |
          kubectl -n "$NS" get deploy checktick-staging-web
          kubectl -n "$NS" get secret checktick-secrets

      - name: Pre-deploy job (staging migrations + syncs)
        env:
          NS: ${{ inputs.namespace }}
          TAG: ${{ inputs.image-tag }}
        run: |
          # Job specs are immutable — clear any previous run first. Distinct
          # name from the prod pre-deploy job the deploy job manages.
          kubectl -n "$NS" delete job checktick-staging-predeploy --ignore-not-found
          # Same tag-substitution rule as prod: the manifest pins a released
          # tag (never `latest`) — substitute the dispatched one so the
          # migration always runs with the code it belongs to.
          sed "s|checktick:[^ ]*|checktick:${TAG}|" k8s/staging-migrate-job.yaml \
            | kubectl apply -f -
          kubectl -n "$NS" wait --for=condition=complete \
            job/checktick-staging-predeploy --timeout=300s

      - name: Roll out new image (staging)
        env:
          NS: ${{ inputs.namespace }}
          TAG: ${{ inputs.image-tag }}
        run: |
          kubectl -n "$NS" set image deployment/checktick-staging-web \
            web="${IMAGE}:${TAG}"

      - name: Wait for staging rollout (readiness-gated)
        env:
          NS: ${{ inputs.namespace }}
        run: |
          kubectl -n "$NS" rollout status deployment/checktick-staging-web \
            --timeout=300s

      - name: Smoke check (staging /healthz via the service)
        env:
          NS: ${{ inputs.namespace }}
          TAG: ${{ inputs.image-tag }}
        run: |
          # Same pattern as the prod smoke: the app image itself (curl is
          # installed in it); tests staging service DNS + a ready pod.
          kubectl -n "$NS" run "deploy-smoke-staging-${GITHUB_RUN_ID}" \
            --restart=Never -i --rm \
            --image="${IMAGE}:${TAG}" \
            --command -- curl -fsS --max-time 10 \
            "http://checktick-staging-web.${NS}.svc.cluster.local:8000/healthz"
          echo "OK: staging /healthz healthy after deploy"

      - name: Roll the staging CronJob to new image
        env:
          NS: ${{ inputs.namespace }}
          TAG: ${{ inputs.image-tag }}
        run: |
          # The deploy job's roll-every-CronJob step skips this one so it
          # moves ONLY after the staging DB is migrated and the staging
          # web rollout is verified — the cron must never run a tag the
          # staging schema has not migrated to.
          args=""
          for c in $(kubectl -n "$NS" get cronjob/prune-unconfirmed-users-staging \
            -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[*].name}'); do
            args="$args $c=${IMAGE}:${TAG}"
          done
          # shellcheck disable=SC2086 — args is deliberately word-split
          kubectl -n "$NS" set image cronjob/prune-unconfirmed-users-staging $args

      - name: Diagnose failure (staging)
        if: failure()
        env:
          NS: ${{ inputs.namespace }}
        run: |
          kubectl -n "$NS" describe job checktick-staging-predeploy || true
          kubectl -n "$NS" logs job/checktick-staging-predeploy --tail=100 || true
          kubectl -n "$NS" get pods -l app=checktick-staging-web -o wide || true

      - name: Report deployed image (staging)
        if: success()
        env:
          NS: ${{ inputs.namespace }}
        run: |
          kubectl -n "$NS" get deploy checktick-staging-web \
            -o jsonpath='{.spec.template.spec.containers[0].image} is live on staging'
